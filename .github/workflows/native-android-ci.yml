name: Native Android CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'assets/native/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/configure-native.mjs'
      - '.github/workflows/native-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run mobile:build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_APP_URL: https://app.example.invalid
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_AUTH_REDIRECT_URL: timefillergames://auth/callback
      - run: npx cap add android
      - run: npm run mobile:configure-native
      - name: Verify Android release configuration
        run: |
          grep -q 'minSdkVersion = 26' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'android:scheme="timefillergames"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Eq 'versionCode[[:space:]]+1' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1.0.0"' android/app/build.gradle
          test -s android/app/src/main/res/drawable/timefillergames_launcher.xml
          grep -q '#22D3C5' android/app/src/main/res/drawable/timefillergames_launcher.xml
          grep -q '@drawable/timefillergames_launcher' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Compile Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Compile Google Play release bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Retain unsigned Play-format AAB
        uses: actions/upload-artifact@v4
        with:
          name: timefillergames-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
