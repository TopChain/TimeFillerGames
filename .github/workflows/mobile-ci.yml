name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run mobile:build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_APP_URL: https://app.example.invalid
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_AUTH_REDIRECT_URL: timefillergames://auth/callback
