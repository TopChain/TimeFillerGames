name: Supabase Integration CI

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/verify-local-supabase.mjs'
      - 'scripts/verify-local-api-e2e.mjs'
      - 'scripts/verify-people-bingo-26.mjs'
      - 'scripts/verify-majority-quickdraw-e2e.mjs'
      - 'scripts/verify-host-recovery-e2e.mjs'
      - 'scripts/verify-retention-e2e.mjs'
      - '.github/workflows/supabase-integration.yml'
      - 'app/api/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deterministic Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          # Keep integration CI reproducible and avoid an unauthenticated
          # "latest release" API lookup that can be rate-limited by GitHub.
          version: 2.114.0

      - name: Start clean local Supabase stack
        run: supabase start

      - name: Replay every migration from scratch
        run: supabase db reset --local

      - name: Normalize local Supabase credentials
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          local_url="${API_URL:-}"
          local_publishable_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          local_secret_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$local_url"
          test -n "$local_publishable_key"
          test -n "$local_secret_key"
          {
            echo "LOCAL_SUPABASE_URL=$local_url"
            echo "LOCAL_SUPABASE_PUBLISHABLE_KEY=$local_publishable_key"
            echo "LOCAL_SUPABASE_SECRET_KEY=$local_secret_key"
          } >> "$GITHUB_ENV"

      - name: Start authenticated account-erasure function
        run: |
          supabase functions serve > /tmp/erase-account.log 2>&1 &
          echo $! > /tmp/erase-account.pid
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/function-probe.json -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/erase-account || true)
            if [ "$code" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/erase-account.log
          exit 1

      - name: Verify anonymous Auth and permanent account erasure end to end
        run: |
          SUPABASE_URL="$LOCAL_SUPABASE_URL" \
          SUPABASE_ANON_KEY="$LOCAL_SUPABASE_PUBLISHABLE_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SUPABASE_SECRET_KEY" \
          node scripts/verify-local-supabase.mjs

      - name: Start TimeFillerGames API against clean local Supabase
        run: |
          NEXT_PUBLIC_SUPABASE_URL="$LOCAL_SUPABASE_URL" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$LOCAL_SUPABASE_PUBLISHABLE_KEY" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$LOCAL_SUPABASE_PUBLISHABLE_KEY" \
          SUPABASE_SECRET_KEY="$LOCAL_SUPABASE_SECRET_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SUPABASE_SECRET_KEY" \
          NEXT_PUBLIC_APP_URL="http://127.0.0.1:3000" \
          CRON_SECRET="local-retention-qa-secret-please-do-not-use-in-production" \
          npm run dev -- --hostname 127.0.0.1 > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid

          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then
              exit 0
            fi
            if [ "$attempt" = "45" ]; then
              cat /tmp/next.log
              exit 1
            fi
            sleep 2
          done

      - name: Verify Host, room, Player, snapshot privacy and Standard Bingo APIs end to end
        run: |
          SUPABASE_URL="$LOCAL_SUPABASE_URL" \
          SUPABASE_ANON_KEY="$LOCAL_SUPABASE_PUBLISHABLE_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SUPABASE_SECRET_KEY" \
          APP_BASE_URL="http://127.0.0.1:3000" \
          node scripts/verify-local-api-e2e.mjs

      - name: Verify 26-player People Bingo subset and draw behavior end to end
        run: |
          SUPABASE_URL="$LOCAL_SUPABASE_URL" \
          SUPABASE_ANON_KEY="$LOCAL_SUPABASE_PUBLISHABLE_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SUPABASE_SECRET_KEY" \
          APP_BASE_URL="http://127.0.0.1:3000" \
          node scripts/verify-people-bingo-26.mjs

      - name: Verify Majority Match and Quick Draw APIs end to end
        run: |
          SUPABASE_URL="$LOCAL_SUPABASE_URL" \
          SUPABASE_ANON_KEY="$LOCAL_SUPABASE_PUBLISHABLE_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SUPABASE_SECRET_KEY" \
          APP_BASE_URL="http://127.0.0.1:3000" \
          node scripts/verify-majority-quickdraw-e2e.mjs

      - name: Verify Host recovery and automatic pause end to end
        run: |
          SUPABASE_URL="$LOCAL_SUPABASE_URL" \
          SUPABASE_ANON_KEY="$LOCAL_SUPABASE_PUBLISHABLE_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SUPABASE_SECRET_KEY" \
          APP_BASE_URL="http://127.0.0.1:3000" \
          node scripts/verify-host-recovery-e2e.mjs

      - name: Verify retention authorization and cascade cleanup end to end
        run: |
          SUPABASE_URL="$LOCAL_SUPABASE_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SUPABASE_SECRET_KEY" \
          APP_BASE_URL="http://127.0.0.1:3000" \
          CRON_SECRET="local-retention-qa-secret-please-do-not-use-in-production" \
          node scripts/verify-retention-e2e.mjs

      - name: Print integration logs on failure
        if: failure()
        run: |
          cat /tmp/erase-account.log 2>/dev/null || true
          cat /tmp/next.log 2>/dev/null || true
          cat /tmp/function-probe.json 2>/dev/null || true
          cat /tmp/health.json 2>/dev/null || true
          supabase status || true

      - name: Stop local services
        if: always()
        run: |
          kill "$(cat /tmp/next.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/erase-account.pid 2>/dev/null)" 2>/dev/null || true
          supabase stop --no-backup || true
