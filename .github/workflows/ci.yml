name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Commit generated dependency lock once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          cp package-lock.json /tmp/package-lock.json
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          cp /tmp/package-lock.json package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add reproducible npm dependency lock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
